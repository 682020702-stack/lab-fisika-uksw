<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#005024"><title>Log Aktivitas | Laboratorium Fisika</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="css/app.css"></head>
<body data-page="activity">
  <div class="app-shell"><aside class="sidebar" id="sidebar"></aside><div class="app-main"><header class="topbar" id="topbar"></header>
    <main class="page-content">
      <section class="page-heading"><div><h1>Log Aktivitas Admin</h1><p>Catatan tindakan Admin untuk membantu pemeriksaan dan koordinasi antar laboran.</p></div></section>
      <section class="panel">
        <div class="filter-row">
          <div class="filter-field"><label class="field-label" for="activity-category-filter">Kategori</label><select class="input-control" id="activity-category-filter"><option value="">Semua kategori</option><option>Barang</option><option>Pengguna</option><option>Peminjaman</option><option>Kategori</option><option>Auth</option><option>Sistem</option></select></div>
          <div class="filter-field"><label class="field-label" for="activity-search">Cari aktivitas</label><input class="input-control" id="activity-search" type="search" placeholder="Admin, aksi, target, atau detail"></div>
          <div class="text-xs text-[#728078]" id="activity-count"></div>
        </div>
        <div class="table-wrap"><table><thead><tr><th>Waktu</th><th>Admin</th><th>Aksi</th><th>Kategori</th><th>Target</th><th>Detail</th><th>IP Address</th></tr></thead><tbody id="activity-body"><tr><td colspan="7"><div class="empty-state">Memuat log aktivitas…</div></td></tr></tbody></table></div>
      </section>
    </main>
  </div></div>
  <script src="js/api.js"></script><script src="js/auth.js"></script><script src="js/layout.js"></script><script src="js/pages.js"></script>
</body></html>
