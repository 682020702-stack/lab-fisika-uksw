<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#005024"><title>Profil | Laboratorium Fisika</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="css/app.css"></head>
<body data-page="profile">
  <div class="app-shell"><aside class="sidebar" id="sidebar"></aside><div class="app-main"><header class="topbar" id="topbar"></header>
    <main class="page-content">
      <section class="page-heading"><div><h1>Kelola Profil</h1><p>Perbarui informasi akun Anda.</p></div></section>
      <section class="grid grid-cols-1 gap-5 xl:grid-cols-[minmax(0,1fr)_300px]">
        <form class="panel p-5 sm:p-7" id="profile-form">
          <div class="mb-6 flex items-center gap-4 border-b border-[#e4eae5] pb-5"><div class="grid h-14 w-14 place-items-center rounded-full bg-[#eaf2df] font-display text-lg font-extrabold text-[#005024]" data-profile-avatar>A</div><div><div class="font-display text-base font-extrabold" data-profile-name>Pengguna</div><div class="mt-1 text-xs text-[#728078]">Profil akun</div></div></div>
          <div class="form-grid">
            <div class="form-field"><label class="field-label" for="profile-name">Nama Lengkap</label><input class="input-control bg-[#f7f9f7]" id="profile-name" readonly aria-readonly="true"></div>
            <div class="form-field"><label class="field-label" for="profile-username">Username</label><input class="input-control" id="profile-username" name="new_username" autocomplete="username" required minlength="3" maxlength="100"></div>
            <div class="form-field"><label class="field-label" for="profile-email">Email</label><input class="input-control bg-[#f7f9f7]" id="profile-email" readonly aria-readonly="true"></div>
            <div class="form-field"><label class="field-label" for="profile-role">Role</label><input class="input-control bg-[#f7f9f7]" id="profile-role" readonly aria-readonly="true"></div>
            <div class="form-field"><label class="field-label" for="profile-gender">Jenis Kelamin</label><input class="input-control bg-[#f7f9f7]" id="profile-gender" readonly aria-readonly="true"></div>
          </div>
          <div class="mt-6 flex justify-end"><button class="btn btn-primary" type="submit">Simpan Perubahan</button></div>
        </form>
        <aside class="panel h-fit p-5"><div class="mb-3 font-display text-sm font-extrabold">Informasi Akun</div><div class="grid gap-4 text-xs"><div><div class="text-[#728078]">Status</div><div class="mt-2"><span class="status-pill" id="profile-status">Memuat</span></div></div><div class="border-t border-[#e4eae5] pt-4"><div class="text-[#728078]">Kredensial</div><div class="mt-1 font-semibold text-[#34433a]">Password tidak ditampilkan</div><button class="btn btn-quiet mt-4 w-full" id="open-password-modal" type="button">Ganti Password</button></div></div></aside>
      </section>
      <dialog class="w-[min(92vw,32rem)] rounded-lg p-0 shadow-2xl backdrop:bg-black/50" id="change-password-modal" aria-labelledby="change-password-title">
        <form class="panel p-5 sm:p-7" id="change-password-form">
          <div class="mb-5"><h2 class="font-display text-lg font-extrabold" id="change-password-title">Ganti Password</h2><p class="mt-1 text-xs text-[#728078]">Gunakan password baru minimal 8 karakter.</p></div>
          <div class="grid gap-4">
            <div class="form-field"><label class="field-label" for="password-current">Password Lama</label><input class="input-control" id="password-current" name="password_lama" type="password" autocomplete="current-password" required maxlength="128"></div>
            <div class="form-field"><label class="field-label" for="password-new">Password Baru</label><input class="input-control" id="password-new" name="password_baru" type="password" autocomplete="new-password" required minlength="8" maxlength="128"></div>
            <div class="form-field"><label class="field-label" for="password-confirm">Konfirmasi Password Baru</label><input class="input-control" id="password-confirm" name="password_konfirmasi" type="password" autocomplete="new-password" required minlength="8" maxlength="128"></div>
          </div>
          <div class="mt-6 flex justify-end gap-2"><button class="btn btn-quiet" id="cancel-password-change" type="button">Batal</button><button class="btn btn-primary" id="submit-password-change" type="submit">Simpan Password</button></div>
        </form>
      </dialog>
    </main>
  </div></div>
  <script src="js/api.js"></script><script src="js/auth.js"></script><script src="js/layout.js?v=export-canonical-3"></script><script src="js/pages.js?v=export-canonical-3"></script>
</body></html>
