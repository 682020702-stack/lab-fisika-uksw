<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#005024">
  <title>Reset Password | Laboratorium Fisika</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/app.css">
  <style>
    .password-visibility-field { position: relative; }
    .password-visibility-field > input { padding-right: 48px; }
    .password-visibility-button { position: absolute; top: 50%; right: 6px; transform: translateY(-50%); display: grid; place-items: center; width: 36px; height: 36px; padding: 0; border: 0; border-radius: 5px; background: transparent; color: #728078; cursor: pointer; }
    .password-visibility-button:hover { background: #f1f7eb; color: #005024; }
    .password-visibility-button:focus-visible { outline: 2px solid #6f9822; outline-offset: 1px; }
    .password-visibility-button svg { width: 19px; height: 19px; }
    .password-visibility-slash { display: none; }
    .password-visibility-button[aria-pressed="true"] .password-visibility-slash { display: block; }
  </style>
</head>
<body data-page="reset-password" class="bg-white">
  <main class="login-page">
    <section class="login-visual" aria-label="Laboratorium Fisika">
      <a class="login-brand login-brand-local" href="index.html">
        <img class="login-brand-image" src="/assets/FSM_UKSW.png" width="950" height="500" alt="Logo FSM dan UKSW">
        <span><span class="brand-title block">LABORATORIUM FISIKA</span><span class="brand-subtitle block">Sistem Inventaris</span></span>
      </a>
      <div class="login-copy">
        <span class="eyebrow">Keamanan akun</span>
        <h1>Buat password<br>baru.</h1>
        <p>Gunakan password baru minimal 8 karakter untuk akun Anda.</p>
      </div>
      <div class="login-visual-foot">Laboratorium Fisika · Sistem Informasi Inventaris</div>
    </section>
    <section class="login-form-side">
      <form class="login-form" id="reset-password-form">
        <span class="mb-3 inline-flex items-center gap-2 text-xs font-bold uppercase tracking-widest text-[#6f9822]"><span class="h-1.5 w-1.5 rounded-full bg-[#90c030]"></span>Portal Laboratorium</span>
        <h2>Password Baru</h2>
        <p class="intro">Masukkan password baru Anda di bawah ini.</p>
        <div class="login-fields">
          <div><label class="field-label" for="new-password">Password Baru</label><div class="password-visibility-field"><input class="input-control" id="new-password" name="new_password" type="password" autocomplete="new-password" required minlength="8" maxlength="128"><button class="password-visibility-button" type="button" data-password-visibility aria-controls="new-password" aria-pressed="false" aria-label="Tampilkan password" title="Tampilkan password"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/><path class="password-visibility-slash" d="m3 3 18 18"/></svg></button></div></div>
          <div><label class="field-label" for="confirm-password">Konfirmasi Password Baru</label><div class="password-visibility-field"><input class="input-control" id="confirm-password" name="confirm_password" type="password" autocomplete="new-password" required minlength="8" maxlength="128"><button class="password-visibility-button" type="button" data-password-visibility aria-controls="confirm-password" aria-pressed="false" aria-label="Tampilkan password" title="Tampilkan password"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/><path class="password-visibility-slash" d="m3 3 18 18"/></svg></button></div></div>
          <div class="login-error" id="reset-message" role="status" aria-live="polite"></div>
          <button class="btn btn-primary login-submit" id="reset-password-submit" type="submit">Simpan Password Baru</button>
        </div>
        <p class="mt-8 text-center text-[11px] text-[#87928a]"><a class="font-semibold text-[#527526] hover:underline" href="index.html">Kembali ke halaman login</a></p>
      </form>
    </section>
  </main>
  <script src="js/api.js"></script>
  <script>
    (() => {
      // Setiap tombol hanya mengubah field yang disebutkan pada aria-controls.
      document.querySelectorAll("[data-password-visibility]").forEach((button) => {
        const input = document.getElementById(button.getAttribute("aria-controls"));
        if (!input) return;
        const setVisible = (visible) => {
          input.type = visible ? "text" : "password";
          button.setAttribute("aria-pressed", String(visible));
          const label = visible ? "Sembunyikan password" : "Tampilkan password";
          button.setAttribute("aria-label", label);
          button.title = label;
        };
        button.addEventListener("click", () => setVisible(input.type === "password"));
        input.form?.addEventListener("reset", () => setVisible(false));
      });
    })();
  </script>
  <script src="js/password-reset.js"></script>
</body>
</html>
